name: CI / CD Quality Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # 1. Backend Verification: Ruff, Mypy, and Pytest with Statement Coverage
  # ============================================================================
  backend-quality:
    name: Backend Lint, Type Check & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov

      - name: Run Ruff Linter & Formatter Check
        run: ruff check backend/app

      - name: Run Mypy Static Type Checking
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest with Coverage
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ============================================================================
  # 2. Frontend Verification: Lint, Vitest Test Suite & Production Build
  # ============================================================================
  frontend-quality:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run Oxlint Linter
        working-directory: frontend
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        working-directory: frontend
        run: npm test

      - name: Run TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # 3. Container Verification: Multi-Stage Docker Build
  # ============================================================================
  docker-build:
    name: Multi-Stage Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: uk-wind-forecast:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
