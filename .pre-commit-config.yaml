# ==============================================================================
# Pre-commit Hook Configuration
# Tools: Ruff (Lint & Format), Mypy (Type checking), Prettier & ESLint
# ==============================================================================

default_language_version:
  python: python3.11
  node: 20.0.0

repos:
  # Universal hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict

  # Python Linting & Formatting (Ruff replaces Flake8, Isort, and Black with 50x speed)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Python Static Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies:
          - pydantic>=2.8.0
          - pydantic-settings>=2.4.0
          - types-requests
          - types-python-dateutil
        args: [--ignore-missing-imports, --check-untyped-defs]

  # Prettier code formatting (TypeScript, CSS, HTML, Markdown, JSON)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^(frontend/src/|docs/|.*\.md$|.*\.ya?ml$)
        additional_dependencies:
          - prettier@3.3.3

  # ESLint for Frontend React & TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.57.0
          - typescript@5.5.0
          - '@typescript-eslint/parser@7.0.0'
          - '@typescript-eslint/eslint-plugin@7.0.0'
